<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== MODÈLE + MOTEUR RÉSEAU (aucune dépendance au DOM) ===== */
const ip2n=s=>s.split('.').reduce((a,b)=>a*256+ +b,0),dot=n=>[24,16,8,0].map(s=>(n>>>s)&255).join('.');
const okIp=s=>/^(\d{1,3}\.){3}\d{1,3}$/.test(s)&&s.split('.').every(x=>+x<256);
const okMask=s=>okIp(s)&&/^1*0*$/.test(ip2n(s).toString(2).padStart(32,'0'));
const plen=m=>ip2n(m).toString(2).replace(/0/g,'').length,netOf=(i,m)=>(ip2n(i)&ip2n(m))>>>0;
const blank=()=>({n:0,devs:[],links:[],ev:[],step:-1});let S=blank();
const dv=id=>S.devs.find(d=>d.id==id);
function mk(t,name,x,y){const id=++S.n,h=v=>v.toString(16).padStart(2,'0'),
 P=t==='pc'||t==='sv'?['Eth0']:t==='sw'?[1,2,3,4,5,6,7,8].map(i=>'Fa0/'+i):['Gi0/0','Gi0/1','Gi0/2'];
 const d={id,type:t,name,x,y,gw:'',routes:[],arp:{},mt:{},out:[],mode:'user',cur:0,vlans:{1:'default'},
  ifs:P.map((n,i)=>({n,ip:'',mask:'',up:t!=='rt',mode:'access',vlan:1,mac:`02:00:00:00:${h(id)}:${h(i)}`}))};
 if(t==='sv')d.svc={dns:{on:false,rec:{}},web:{on:false,page:'Bienvenue sur le serveur web Trame.'}};S.devs.push(d);return d}
function peer(d,i){const l=S.links.find(l=>(l[0]===d.id&&l[1]===i)||(l[2]===d.id&&l[3]===i));if(!l)return null;
 const f=l[0]===d.id&&l[1]===i,n=dv(f?l[2]:l[0]),j=f?l[3]:l[1];
 return d.ifs[i].up&&n.ifs[j].up?[n,n.ifs[j],j]:null}
function l2(d,i,f,ev){const out=[],seen=new Set();
 (function go(a,ai,tag){const p=peer(a,ai);if(!p)return;const[n,ni,nj]=p;
  ev.push({a:a.id,b:n.id,k:f.k,t:`Trame ${f.src} → ${f.dst}${tag?' [802.1Q VLAN '+tag+']':''} · ${f.d}`,f:{s:f.src,d:f.dst,v:tag,p:f.p}});
  if(n.kind==='hb'){if(seen.has(n.id))return;seen.add(n.id);ev.push({a:n.id,b:n.id,k:'i',t:`${n.name} (hub) répète la trame sur tous ses autres ports, sans table MAC`});n.ifs.forEach((x,j)=>{if(j!==nj)go(n,j,tag)});return}
  if(n.type!=='sw'){if(!tag){if(f.dst[0]!=='f'&&ni.mac!==f.dst)ev.push({a:n.id,b:n.id,k:'i',t:`${n.name} ignore la trame : l’adresse MAC destinataire n’est pas la sienne`});out.push([n,ni])}else ev.push({a:n.id,b:n.id,k:'x',t:`${n.name} ignore la trame étiquetée VLAN ${tag} (pas de sous-interfaces)`});return}
  const tr=ni.mode==='trunk',v=tr?(tag||1):(ni.vlan||1);
  if(!tr&&tag){ev.push({a:n.id,b:n.id,k:'x',t:`${n.name} ${ni.n} : trame étiquetée VLAN ${tag} reçue sur un port access, rejetée (trunk configuré d’un seul côté ?)`});return}
  if(!n.vlans[v]){ev.push({a:n.id,b:n.id,k:'x',t:`${n.name} : le VLAN ${v} n’existe pas sur ce switch, trame rejetée`});return}
  if(seen.has(n.id+'|'+v))return;seen.add(n.id+'|'+v);
  if(n.mt[v+'|'+f.src]!==ni.n){n.mt[v+'|'+f.src]=ni.n;ev.push({a:n.id,b:n.id,k:'i',t:`${n.name} apprend ${f.src} sur ${ni.n} (VLAN ${v})`})}
  const t=n.mt[v+'|'+f.dst];n.ifs.forEach((x,j)=>{if(j===nj||(t&&t!==x.n))return;if(x.mode==='trunk')go(n,j,v===1?null:v);else if((x.vlan||1)===v)go(n,j,null)})})(d,i,null);
 return out}
function arp(d,ic,ip,ev){if(d.arp[ip])return d.arp[ip];
 const r=l2(d,d.ifs.indexOf(ic),{src:ic.mac,dst:'ff:ff:ff:ff:ff:ff',k:'arp',d:`ARP : qui a ${ip} ? Répondre à ${ic.ip}`},ev),t=r.find(([n,ni])=>ni.ip===ip);
 if(!t)return null;
 const[n,ni]=t;ev.miss=1;d.arp[ip]=ni.mac;n.arp[ic.ip]=ic.mac;
 l2(n,n.ifs.indexOf(ni),{src:ni.mac,dst:ic.mac,k:'arp',d:`ARP : ${ip} est à ${ni.mac}`},ev);return ni.mac}
const allRoutes=d=>d.gw?[{n:'0.0.0.0',m:'0.0.0.0',v:d.gw},...d.routes]:d.routes;
function route(d,dst){let b=null,bl=-1;
 d.ifs.forEach(ic=>{if(ic.up&&ic.ip&&netOf(dst,ic.mask)===netOf(ic.ip,ic.mask)&&plen(ic.mask)>bl){bl=plen(ic.mask);b={ic,nh:dst}}});
 allRoutes(d).forEach(r=>{if(netOf(dst,r.m)===netOf(r.n,r.m)&&plen(r.m)>bl){
  const ic=d.ifs.find(x=>x.up&&x.ip&&netOf(r.v,x.mask)===netOf(x.ip,x.mask));if(ic){bl=plen(r.m);b={ic,nh:r.v}}}});
 return b}
const mine=(d,ip)=>d.ifs.some(i=>i.up&&i.ip===ip);
const isH=d=>d.type==='pc'||d.type==='sv';
const bad=(d,ev,why)=>(ev.push({a:d.id,b:d.id,k:'x',t:why}),{ok:0,why,at:d});
function ipOut(d,p,ev){
 if(mine(d,p.dst))return{ok:1,at:d,ttl:p.ttl};
 const r=route(d,p.dst);
 if(!r)return bad(d,ev,`${d.name} : aucune route vers ${p.dst}`+(isH(d)&&!d.gw?' (pas de passerelle par défaut)':''));
 const mac=arp(d,r.ic,r.nh,ev);
 if(!mac)return bad(d,ev,`${d.name} : ARP sans réponse pour ${r.nh} (câble, interface éteinte ou mauvaise adresse ?)`);
 if(!p.src)p.src=r.ic.ip;
 const hit=l2(d,d.ifs.indexOf(r.ic),{src:r.ic.mac,dst:mac,k:p.k||'ip',d:`Paquet IP ${p.src} → ${p.dst} TTL=${p.ttl} (${p.what})`,p:{s:p.src,d:p.dst,ttl:p.ttl,w:p.what}},ev).find(([n,ni])=>ni.mac===mac);
 if(!hit)return bad(d,ev,'Trame perdue');
 const n=hit[0];
 if(mine(n,p.dst))return{ok:1,at:n,ttl:p.ttl};
 if(n.type!=='rt')return bad(n,ev,`${n.name} ne route pas : ce n’est pas l’adresse destinataire`);
 if(p.ttl<=1)return bad(n,ev,`TTL expiré chez ${n.name}`);
 const dr=n.kind==='fw'&&fwDeny(n,p);if(dr)return bad(n,ev,fwWhy(n,dr));return ipOut(n,{...p,ttl:p.ttl-1},ev)}
function ping(d,dst){const ev=[],t0=x=>isH(x)?128:255;
 if(mine(d,dst))return{ok:1,ttl:t0(d),ev};
 const p={src:'',dst,ttl:t0(d),what:'ICMP echo-request'},q=ipOut(d,p,ev);
 if(!q.ok)return{ok:0,why:q.why,ev};
 const r=ipOut(q.at,{src:dst,dst:p.src,ttl:t0(q.at),what:'ICMP echo-reply'},ev);
 return r.ok?{ok:1,ttl:r.ttl,ev}:{ok:0,why:'Retour impossible : '+r.why,ev}}
/* ===== CONFIGURATION (partagée par les formulaires et le terminal) ===== */
const flush=()=>S.devs.forEach(x=>x.arp={}),cab=(d,i)=>S.links.some(l=>(l[0]===d.id&&l[1]===i)||(l[2]===d.id&&l[3]===i));
const hostErr=(ip,mask)=>{if(!okIp(ip))return'Adresse IPv4 invalide (ex. 192.168.1.10).';if(!okMask(mask))return'Masque invalide (ex. 255.255.255.0).';
 const n=netOf(ip,mask),a=ip2n(ip);return a===n||a===((n|~ip2n(mask))>>>0)?'Adresse réseau ou de diffusion : choisissez une adresse d’hôte.':''};
function setHost(d,ip,mask,gw,dns){const e=hostErr(ip,mask);if(e)return e;
 if(gw&&(!okIp(gw)||netOf(gw,mask)!==netOf(ip,mask)))return'Passerelle invalide ou hors du sous-réseau de l’hôte.';
 if(dns&&!okIp(dns))return'Serveur DNS invalide.';
 const x=d.ifs[0];x.ip=ip;x.mask=mask;d.gw=gw||'';d.dns=dns||'';d.dh=false;flush();return''}
function setIf(d,ic,ip,mask){const e=hostErr(ip,mask);if(e)return e;
 const o=d.ifs.find(x=>{const s=plen(mask)<plen(x.mask)?mask:x.mask;return x!==ic&&x.ip&&netOf(ip,s)===netOf(x.ip,s)});
 if(o)return`Ce réseau chevauche celui de ${o.n} (${o.ip}).`;
 ic.ip=ip;ic.mask=mask;flush();return''}
function addRoute(d,n,k,v){if(!okIp(n)||!okMask(k)||!okIp(v))return'Réseau, masque et saut suivant doivent être des adresses IPv4 valides.';
 if(netOf(n,k)!==ip2n(n))return`${n} n’est pas une adresse de réseau pour ce masque (essayez ${dot(netOf(n,k))}).`;
 if(d.routes.some(r=>r.n===n&&r.m===k&&r.v===v))return'Cette route existe déjà.';
 d.routes.push({n,m:k,v});return''}
function setDhcp(d,ic,on,start,cnt,dns){if(!on){ic.dhcp=null;return''}
 if(!ic.ip)return'Configurez d’abord l’adresse IP de l’interface.';
 cnt=+cnt;if(!okIp(start)||!(cnt>=1&&cnt<=250)||(dns&&!okIp(dns)))return'Pool invalide : adresse de début, nombre (1 à 250) et DNS valides requis.';
 const n=netOf(ic.ip,ic.mask);
 if(netOf(start,ic.mask)!==n||netOf(dot(ip2n(start)+cnt-1),ic.mask)!==n)return`Le pool doit rester dans le réseau de l’interface (${dot(n)}/${plen(ic.mask)}).`;
 ic.dhcp={start,n:cnt,dns:dns||'',leases:ic.dhcp?ic.dhcp.leases:{}};return''}
function dhcp(d){const ev=[],e=d.ifs[0],B='ff:ff:ff:ff:ff:ff';e.ip='';e.mask='';d.gw='';d.dns='';d.arp={};
 const rx=l2(d,0,{src:e.mac,dst:B,k:'ip',d:'DHCP Discover (UDP 68 → 67)'},ev),s=rx.find(([n,ni])=>n.type==='rt'&&ni.ip&&ni.dhcp&&netOf(ni.dhcp.start,ni.mask)===netOf(ni.ip,ni.mask));
 if(!s)return{...bad(d,ev,'Aucun serveur DHCP n’a répondu : câble ou routeur éteint, interface sans adresse, DHCP non activé sur l’interface du routeur ou pool hors du réseau.'),ev};
 const[r,ri]=s,D=ri.dhcp,j=r.ifs.indexOf(ri),used=new Set(S.devs.flatMap(x=>x.ifs.map(i=>i.ip)));
 let ip=D.leases[e.mac];if(!ip||used.has(ip)){ip='';for(let k=0;k<D.n&&!ip;k++){const c=dot(ip2n(D.start)+k);if(!used.has(c))ip=c}}
 if(!ip)return{...bad(r,ev,`Le pool DHCP de ${r.name} ${ri.n} est épuisé.`),ev};
 l2(r,j,{src:ri.mac,dst:e.mac,k:'ip',d:`DHCP Offer : ${ip}`},ev);
 l2(d,0,{src:e.mac,dst:B,k:'ip',d:`DHCP Request : ${ip}`},ev);
 l2(r,j,{src:ri.mac,dst:e.mac,k:'ip',d:`DHCP Ack : ${ip}, passerelle ${ri.ip}`},ev);
 D.leases[e.mac]=ip;e.ip=ip;e.mask=ri.mask;d.gw=ri.ip;d.dns=D.dns;return{ok:1,ev,ip}}
function dhcpRun(d){d.dh=true;const r=dhcp(d);S.ev=r.ev;S.step=-1;return r}
function check(d){const L=[],w=(l,t)=>L.push([l,t]),all=S.devs.flatMap(x=>x.ifs.map(i=>[x,i]));
 if(d.type==='sw')return swCheck(d,w,L);
 d.ifs.forEach((x,i)=>{
  if(!cab(d,i))w('wn',`${x.n} : aucun câble branché`);else if(!x.up)w('wn',`${x.n} : interface désactivée, la liaison est inactive`);
  if(d.type==='rt'&&cab(d,i)&&!x.ip)w('wn',`${x.n} : aucune adresse IP (pas de communication possible par cette interface)`);
  const f=far(d,i);if(f&&f[0].type==='sw'&&f[1].mode==='trunk')w('wn',`${x.n} : branché sur un port trunk (${f[0].name} ${f[1].n}) : seules les trames du VLAN natif 1 passent`);
  if(!x.ip)return;
  const o=all.find(([y,j])=>j!==x&&j.ip===x.ip);if(o)w('er',`${x.n} : l’adresse ${x.ip} est déjà utilisée par ${o[0].name} ${o[1].n}`);
  d.ifs.forEach((y,k)=>{if(k>i&&y.ip){const s=plen(x.mask)<plen(y.mask)?x.mask:y.mask;if(netOf(x.ip,s)===netOf(y.ip,s))w('er',`${x.n} et ${y.n} sont dans le même réseau`)}});
  if(x.dhcp&&netOf(x.dhcp.start,x.mask)!==netOf(x.ip,x.mask))w('er',`${x.n} : le pool DHCP n’est plus dans le réseau de l’interface (serveur inactif)`)});
 if(isH(d)){const e=d.ifs[0];
  if(!e.ip)w(d.dh?'wn':'er',d.dh?'DHCP : aucune adresse reçue (relancez la demande)':'Aucune adresse IPv4 : le PC ne peut pas communiquer');
  else if(!d.gw)w('wn','Pas de passerelle : ce PC ne joindra que son propre réseau');
  else{const g=all.find(([y,j])=>j.ip===d.gw);if(!g)w('wn',`Aucun équipement du labo n’a l’adresse ${d.gw} (passerelle)`);else{const v1=vlanAt(d,0),v2=vlanAt(g[0],g[0].ifs.indexOf(g[1]));if(v1&&v2&&v1!==v2)w('wn',`Ce PC est dans le VLAN ${v1} mais la passerelle ${d.gw} (${g[0].name} ${g[1].n}) est dans le VLAN ${v2} : ils ne peuvent pas échanger de trames`)}}}
 if(isH(d)&&d.dns){const s=all.find(([y,j])=>j.ip===d.dns);if(!s)w('wn',`Serveur DNS ${d.dns} : aucun équipement du labo n’a cette adresse`);else if(!(s[0].svc&&s[0].svc.dns.on))w('wn',`${s[0].name} (${d.dns}) n’a pas le service DNS activé`)}
 if(d.type==='sv'&&d.svc.dns.on&&!Object.keys(d.svc.dns.rec).length)w('wn','Service DNS activé mais sans aucun enregistrement');
 if(d.type==='rt')d.routes.forEach(r=>{if(!d.ifs.some(x=>x.up&&x.ip&&netOf(r.v,x.mask)===netOf(x.ip,x.mask)))w('wn',`Route ${r.n}/${plen(r.m)} : le saut suivant ${r.v} n’est dans aucun réseau connecté actif (route inactive)`)});
 return L}
/* ===== VLAN (modèle partagé par les formulaires et le terminal) ===== */
const far=(d,i)=>{const l=S.links.find(l=>(l[0]===d.id&&l[1]===i)||(l[2]===d.id&&l[3]===i));if(!l)return null;const f=l[0]===d.id&&l[1]===i,n=dv(f?l[2]:l[0]);return[n,n.ifs[f?l[3]:l[1]]]};
const vlanAt=(d,i)=>{const f=far(d,i);return f&&f[0].type==='sw'?(f[1].mode==='trunk'?1:f[1].vlan):null};
function setPort(d,i,mode,vlan){const x=d.ifs[i];
 if(vlan!==null){const v=+vlan;if(!Number.isInteger(v)||v<1||v>4094)return'VLAN invalide (1 à 4094).';if(!d.vlans[v])return`Le VLAN ${v} n’existe pas sur ${d.name} : créez-le d’abord.`;x.vlan=v}

function iosPick(d,tok){const mc=IOSM[d.mode],H=[];
 for(const[md,sp,fn]of IOS){if(!md.includes(mc))continue;const w=sp.split(' '),P=[];let sc=0,ex=0,ok=true;
  for(let i=0;i<w.length&&ok;i++){const k=w[i];
   if(k==='*'){P.push(tok.slice(i));break}
   if(i>=tok.length){ok=false;break}
   if(k[0]==='<'){P.push(tok[i]);continue}
   const t=tok[i].toLowerCase();if(k.startsWith(t)){sc++;if(k===t)ex++}else ok=false}
  if(ok&&(w[w.length-1]==='*'||tok.length===w.length))H.push({fn,P,sc:sc*100+ex})}
 if(!H.length)return null;const b=Math.max(...H.map(h=>h.sc)),T=H.filter(h=>h.sc===b);
 return T.length>1&&new Set(T.map(h=>h.fn)).size>1?'amb':T[0]}
function iosHelp(d,pre,part){const mc=IOSM[d.mode],S2=new Set();let cr=false;
 for(const[md,sp]of IOS){if(!md.includes(mc))continue;const w=sp.split(' ');let ok=true;
  for(let i=0;i<pre.length;i++){const k=w[i];if(!k||k==='*'){ok=k==='*';break}if(k[0]!=='<'&&!k.startsWith(pre[i].toLowerCase())){ok=false;break}}
  if(!ok)continue;const n=w[pre.length];
  if(n===undefined||n==='*'){cr=true;if(n)S2.add('<texte>')}else if(n[0]==='<')S2.add(n);else if(n.startsWith(part.toLowerCase()))S2.add(n)}
 const L=[...S2].sort();if(cr)L.push('<cr>');return L.length?L:['% Aucune commande ne correspond.']}
function iosRun(d,tok){const last=tok[tok.length-1]||'';
 if(last.endsWith('?'))return[iosHelp(d,tok.slice(0,-1),last.slice(0,-1)).join('   ')];
 const h=iosPick(d,tok);
 if(h==='amb')return['% Commande ambiguë : '+tok.join(' ')];
 if(!h){if(d.mode==='user'){d.mode='priv';const h2=iosPick(d,tok);d.mode='user';if(h2&&h2!=='amb')return[iosNP]}return['% Commande invalide ou non prise en charge (tapez ? pour la liste).']}
 return h.fn(d,h.P)||[]}
function netCmd(d,a,c){return iosRun(d,c==='help'?['?']:a)}
function run(d,raw){if(!isH(d)&&d.mode==='pw'){d.out.push('Password:');const ok=raw===iosX(d).secret;d.mode=ok?'priv':'user';if(!ok)d.out.push('% Bad secrets : mot de passe incorrect');d.out=d.out.slice(-150);return}
 d.out.push(ps1(d)+' '+raw);const t=raw.trim();if(!t)return;
 if(/^(cls|clear)$/i.test(t)){d.out=[];return}
 const a=t.split(/\s+/),c=a[0].toLowerCase();
 d.out.push(...(isH(d)?pcCmd(d,a,c):netCmd(d,a,c)));d.out=d.out.slice(-150)}

const LABS={r:{t:'Labo 1 · Routage entre deux réseaux',o:`<p><b>Objectif :</b> faire communiquer PC1 (192.168.1.10) et PC2 (192.168.2.10) à travers R1, qui n’a encore aucune adresse et dont les interfaces sont éteintes.</p><p>Touchez R1 : l’onglet Config règle ses interfaces (adresse, masque, activation), ses routes et son DHCP sans commande ; le terminal reste disponible (<code>enable</code>, <code>show ip interface brief</code>…). Défi : activez un serveur DHCP sur l’interface du réseau de PC1 (début 192.168.1.100), puis passez PC1 en DHCP. Chaque ping s’affiche pas à pas dans l’onglet Trace.</p>`,tests:[['PC1','PC2']]},
 v:{t:'Labo 2 · VLAN, trunk et routage inter-VLAN',o:`<p><b>Objectif :</b> deux VLAN répartis sur deux switches. VLAN 10 : PC1 (SW1 Fa0/1), PC3 (SW2 Fa0/1) et R1 Gi0/0 (SW1 Fa0/4). VLAN 20 : PC2 (SW1 Fa0/2), PC4 (SW2 Fa0/2) et R1 Gi0/1 (SW2 Fa0/4). Le lien SW1 Fa0/3 ↔ SW2 Fa0/3 doit devenir un trunk.</p><p>À faire : créer les VLAN 10 et 20 sur <b>chaque</b> switch (onglet Config du switch ou commande <code>vlan 10</code>), affecter les ports, passer les deux extrémités du lien en trunk, puis configurer R1 (Gi0/0 = 192.168.10.1/24, Gi0/1 = 192.168.20.1/24, interfaces activées). Les PC sont déjà réglés. Testez PC1 → PC3 (même VLAN, à travers le trunk) puis PC1 → PC2 (inter-VLAN, via R1).</p>`,tests:[['PC1','PC3'],['PC2','PC4'],['PC1','PC2']]}};

dep('d1','Mauvais masque','PC1 envoie sa requête à PC2, mais aucune réponse ne revient ; dans l’autre sens, PC2 n’atteint pas PC1.',TT,()=>{example();cfgR();gd('PC2').ifs[0].mask='255.255.0.0'},
 ['Comparez les deux sens : où chaque ping échoue-t-il ? Lisez bien la cause affichée.','L’échec parle d’un ARP sans réponse sur PC2 pour une adresse qui devrait être derrière le routeur. Comparez ipconfig sur PC1 et sur PC2.','PC2 a le masque 255.255.0.0 au lieu de 255.255.255.0 : il croit PC1 sur son propre réseau.'],

 vadd:()=>{const d=dv(ui.sel),i=$('#vi').value.trim(),e=addVlan(d,i,$('#vn').value.trim());return e?fail(e):msg(`VLAN ${i} créé sur ${d.name}`)},
 vdel:D=>{const d=dv(ui.sel),e=delVlan(d,D.i);return e?fail(e):msg(`VLAN ${D.i} supprimé de ${d.name}`)},
 m4:D=>{ui.dh=D.v==='1'},
 apc:()=>{const d=dv(ui.sel),g=k=>$(k).value.trim();
  if(ui.dh){const r=dhcpRun(d);return msg(r.ok?`DHCP : ${d.name} a reçu ${r.ip} (détail dans l’onglet Trace)`:'⚠ DHCP : '+r.why)}
  const e=setHost(d,g('#fi'),g('#fm'),g('#fg'),g('#fd'));return e?fail(e):msg(`${d.name} : configuration enregistrée`)},
 rif:D=>{const d=dv(ui.sel),i=+D.i,e=setIf(d,d.ifs[i],$('#ri'+i).value.trim(),$('#rm'+i).value.trim());return e?fail(e):msg(`${d.name} ${d.ifs[i].n} : adresse enregistrée`)},
 rup:D=>{const d=dv(ui.sel),x=d.ifs[+D.i];x.up=!x.up;msg(`${d.name} ${x.n} : ${x.up?'activée':'désactivée'}`)},
 rdh:D=>{const d=dv(ui.sel),i=+D.i,g=k=>$(k+i).value.trim(),e=setDhcp(d,d.ifs[i],1,g('#rs'),g('#rc'),g('#rd'));return e?fail(e):msg(`DHCP enregistré sur ${d.ifs[i].n}`)},
 rdx:D=>{const d=dv(ui.sel);setDhcp(d,d.ifs[+D.i],0);msg('Serveur DHCP arrêté')},
 radd:()=>{const d=dv(ui.sel),g=k=>$(k).value.trim(),e=addRoute(d,g('#rn'),g('#rk'),g('#rv'));return e?fail(e):msg('Route statique ajoutée')},
 rdel:D=>{dv(ui.sel).routes.splice(+D.i,1);msg('Route supprimée')}});
Object.assign(A,{lp:()=>add('lp'),pr:()=>add('pr'),hb:()=>add('hb'),ap:()=>add('ap'),fw:()=>add('fw'),th:D=>{setTheme(D.v,1);return 0},
 aps:()=>{const d=dv(ui.sel),s=$('#apn').value.trim(),k=$('#apk').value;if(!d||d.kind!=='ap')return 0;
  if(!/^[\w .-]{1,24}$/.test(s))return fail('Nom de réseau invalide (1 à 24 caractères : lettres, chiffres, espace, point, tiret).');
  if(S.devs.some(x=>x!==d&&x.kind==='ap'&&x.ssid===s))return fail('Ce nom de réseau existe déjà sur une autre borne.');
  if(k&&(k.length<8||k.length>32))return fail('La clé WPA2 doit faire de 8 à 32 caractères (ou rester vide pour un réseau ouvert).');
  const ch=d.ssid!==s||d.key!==k;d.ssid=s;d.key=k;if(ch){S.links=S.links.filter(l=>!(l[4]==='w'&&l[2]===d.id));flush()}
  return msg(ch?'Borne enregistrée : les postes doivent se reconnecter':'Aucun changement')},
 wfc:()=>{const d=dv(ui.sel),sel=$('#wfs'),ap=sel&&dv(+sel.value),k=$('#wfk').value;if(!d||!ap)return 0;
  if(cab(d,0))return fail('Débranchez d’abord le câble de ce poste : il n’a qu’une interface réseau.');
  if(ap.key&&k!==ap.key)return fail('Clé Wi‑Fi incorrecte pour « '+ap.ssid+' » : association refusée.');
  const j=ap.ifs.findIndex((_,i)=>!cab(ap,i));if(j<0)return fail('La borne n’a plus de port libre.');
  S.links.push([d.id,0,ap.id,j,'w']);flush();return msg(`${d.name} connecté à ${ap.ssid}`)},
 wfo:()=>{S.links=S.links.filter(l=>!(l[4]==='w'&&l[0]===ui.sel));flush();return msg('Wi‑Fi déconnecté')},
 fra:()=>{const d=dv(ui.sel);if(!d||d.kind!=='fw')return 0;
  const r=fwNorm({a:$('#fa').value,pr:$('#fp').value,s:$('#fs').value.trim()||'any',d:$('#fd').value.trim()||'any',pt:$('#ft').value.trim()});
  if(!r)return fail('Règle invalide : source et destination valent « any » ou une adresse ou un réseau (ex. 192.168.1.0/24) ; le port va de 0 à 65535.');
  if((d.rules||(d.rules=[])).length>=30)return fail('30 règles maximum.');d.rules.push(r);return msg('Règle ajoutée')},
 frd:D=>{const d=dv(ui.sel);if(d&&d.rules)d.rules.splice(+D.i,1);return msg('Règle supprimée')},
 zin:()=>{ui.v.s=clampS(ui.v.s*1.25);applyView();return 0},zout:()=>{ui.v.s=clampS(ui.v.s/1.25);applyView();return 0}});
document.addEventListener('click',e=>{const m=document.querySelector('.menu[open]');if(m&&(!m.contains(e.target)||e.target.closest('.pop button')))m.removeAttribute('open')});
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.k){ui.open=!(ui.open&&ui.tab===D.k);ui.tab=D.k;return panel()}
 if(D.c){const i=$('#in');i.value=D.c;i.focus();return}
 if(A[D.a]&&A[D.a](D)!==0)render()};
document.onkeydown=e=>{const d=dv(ui.sel);if(e.key!=='Enter'||e.target.id!=='in'||!d)return;
 const v=e.target.value;run(d,v);commit();if(/^\s*ping/i.test(v))msg('Parcours des paquets : onglet Trace');panel();$('#in').focus();draw()};
document.onchange=e=>{const t=e.target,D=t.dataset||{};
 if(t.id==='fimp'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(j.format&&j.format!=='netlab-project')throw 0;const p=j.project||j;if(!p||!Array.isArray(p.devs)||!Array.isArray(p.links))throw 0;useProject(p);msg(`Projet importé : ${f.name}`);render()}catch(x){msg('⚠ Fichier invalide : ce n’est pas un projet NetLab')}};
  r.readAsText(f);t.value='';return}
 if(D.w){const d=dv(ui.sel),i=+D.p,x=D.w==='m'?setPort(d,i,t.value,null):setPort(d,i,null,t.value);x?fail(x):msg(`${d.name} ${d.ifs[i].n} : ${D.w==='m'?'mode '+t.value:'VLAN '+t.value}`);render()}};
example();render();
</script></body></html>
